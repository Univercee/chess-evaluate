name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Least privilege: read the repo, publish to Pages (OIDC token for deploy-pages)
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-progress one finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Provides the site's base path ("/chess-evaluate", or "" for a custom domain) and full URL
      - id: pages
        uses: actions/configure-pages@v6

      - run: npm ci

      - run: npm run typecheck

      # BASE_PATH sets Vite's `base` (asset and engine URLs under the project subpath);
      # SITE_URL enables canonical/og:url/hreflang tags and sitemap.xml (see vite.config.js)
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
