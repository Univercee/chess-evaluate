version: '3.8'

services:
  chess-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Public site address for SEO tags and sitemap.xml. Compose reads it from .env in this
        # folder (see .env.example); .env itself isn't sent to the build (.dockerignore)
        SITE_URL: ${SITE_URL:-}
    container_name: chess-app
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    environment:
      - NODE_ENV=production
